<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>팀 위키</title>
<style>
:root{--bg:#f7f7f5;--panel:#fff;--side:#f0efec;--hover:#e6e5e1;--text:#1f2328;--muted:#6b6f76;--line:#e3e2de;--accent:#2f6fde;--accent-weak:#e8f0fd;--code:#f2f1ee;--danger:#d1453b;--missing:#c2410c;--mark:#fde68a;--ok:#16a34a;--warn-bg:#fff4e5;--warn:#9a5b00}
@media (prefers-color-scheme:dark){:root{--bg:#191a1c;--panel:#202124;--side:#1c1d1f;--hover:#2a2b2f;--text:#e6e6e6;--muted:#9aa0a6;--line:#2e3034;--accent:#6ea0ff;--accent-weak:#24324a;--code:#2a2b2e;--danger:#ff6b61;--missing:#fb923c;--mark:#7c5e10;--ok:#4ade80;--warn-bg:#3a2a12;--warn:#fbbf6b}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.65 "Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
button{font:inherit}
.app{display:grid;grid-template-columns:272px 1fr;height:100vh}
aside{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:9px;padding:16px 16px 10px;font-weight:700;font-size:15px}
.logo{width:26px;height:26px;border-radius:7px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:13px}
.brand small{display:block;font-weight:400;font-size:11.5px;color:var(--muted);line-height:1.2}
.search{margin:4px 12px 8px}
.search input{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);font:inherit;font-size:13.5px;outline:none}
.search input:focus{border-color:var(--accent)}
.newbtn{margin:0 12px 6px;padding:7px 10px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:13.5px;font-weight:600;cursor:pointer;text-align:left}
.newbtn:hover{filter:brightness(1.07)}
.sec-title{font-size:11.5px;color:var(--muted);padding:10px 16px 4px;font-weight:600}
#tree{flex:1;overflow:auto;padding:2px 8px 8px}
#recent{padding:0 8px 6px;max-height:150px;overflow:auto}
.row{display:flex;align-items:center;gap:2px;padding:4px 8px;border-radius:6px;cursor:pointer;font-size:14px;user-select:none}
.row:hover{background:var(--hover)}
.row.active{background:var(--accent-weak);color:var(--accent);font-weight:600}
.tw{width:16px;text-align:center;color:var(--muted);font-size:11px;flex:none;border-radius:3px}
.tw:hover{background:var(--line)}
.row .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .lk{font-size:11px;flex:none;margin-left:2px}
.row .add{opacity:0;width:20px;text-align:center;color:var(--muted);border-radius:4px;flex:none}
.row:hover .add{opacity:1}
.row .add:hover{background:var(--line)}
.row.res{display:block;padding:6px 10px}
.snip{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .when{font-size:11px;color:var(--muted);flex:none;margin-left:6px}
mark{background:var(--mark);color:inherit;border-radius:2px}
.empty-s{color:var(--muted);font-size:13px;padding:10px}
.foot{border-top:1px solid var(--line);padding:10px 12px;font-size:12px;color:var(--muted)}
.foot .btns{display:flex;gap:6px;margin-bottom:8px}
.foot .btns .btn{flex:1}
#team{margin-bottom:6px;line-height:1.5}
#team .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:5px;vertical-align:0}
#team .dot.off{background:var(--danger)}
#team .dot.local{background:var(--muted)}
#team .users{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
#team .users span{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:0 8px;color:var(--text)}
#team .users span.me{border-color:var(--accent);color:var(--accent)}
.linkish{color:var(--accent);cursor:pointer}
main{overflow:auto;min-width:0}
.wrap{max-width:860px;margin:0 auto;padding:22px 40px 80px}
.wrap.wide{max-width:1320px}
.topbar{display:flex;align-items:center;gap:10px;min-height:34px;margin-bottom:6px}
.crumbs{flex:1;font-size:13px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.crumbs a{color:var(--muted)}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:5px 11px;border-radius:7px;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger:hover{color:var(--danger);border-color:var(--danger)}
.menu{display:none}
.dd{position:relative}
.dd-menu{position:absolute;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.14);padding:4px;z-index:30;min-width:190px}
.dd-menu[hidden]{display:none}
.dd-menu button{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;border:none;background:none;color:var(--text);padding:7px 10px;border-radius:6px;cursor:pointer;font-size:13px}
.dd-menu button:hover{background:var(--hover)}
.dd-menu button small{color:var(--muted)}
.lockbar{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13.5px;margin:6px 0 10px}
h1.title{font-size:30px;margin:8px 0 2px;line-height:1.3;word-break:keep-all}
.meta{color:var(--muted);font-size:12.5px;margin-bottom:22px}
.md{word-break:keep-all;overflow-wrap:anywhere}
.md h1{font-size:24px;border-bottom:1px solid var(--line);padding-bottom:6px;margin:28px 0 12px}
.md h2{font-size:20px;margin:26px 0 10px}
.md h3{font-size:17px;margin:20px 0 8px}
.md h4,.md h5,.md h6{font-size:15px;margin:16px 0 6px}
.md>:first-child{margin-top:0}
.md p{margin:0 0 12px}
.md code{background:var(--code);padding:1px 5px;border-radius:4px;font-family:Consolas,"D2Coding",monospace;font-size:.9em}
.md pre{background:var(--code);padding:12px 14px;border-radius:8px;overflow:auto;margin:0 0 14px;line-height:1.5}
.md pre code{background:none;padding:0}
.md blockquote{margin:0 0 14px;padding:8px 14px;border-left:3px solid var(--accent);background:var(--accent-weak);border-radius:0 6px 6px 0}
.md blockquote p:last-child{margin:0}
.md hr{border:none;border-top:1px solid var(--line);margin:22px 0}
.md ul,.md ol{padding-left:22px;margin:0 0 12px}
.md li>ul,.md li>ol{margin:2px 0}
.md li.task{list-style:none;margin-left:-20px}
.md li.task.done>span{color:var(--muted);text-decoration:line-through}
.md li.task input{margin:0 4px 0 0;accent-color:var(--accent);cursor:pointer;vertical-align:-2px}
.tbl{overflow:auto;margin:0 0 14px}
table{border-collapse:collapse;min-width:50%;font-size:14px}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
th{background:var(--code);font-weight:600}
.tbl-bar{display:flex;align-items:center;gap:8px;margin:0 0 6px}
.tbl-q{padding:4px 9px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text);font:inherit;font-size:13px;width:200px;max-width:60%;outline:none}
.tbl-q:focus{border-color:var(--accent)}
.tbl-count{font-size:12px;color:var(--muted)}
.tbl-reset{border:none;background:none;color:var(--accent);font-size:12px;cursor:pointer;padding:0}
.tbl-reset[hidden]{display:none}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{background:var(--hover)}
th.sortable::after{content:'↕';margin-left:6px;color:var(--muted);font-size:11px;opacity:.6}
th.sortable[data-sort=asc]::after{content:'▲';color:var(--accent);opacity:1}
th.sortable[data-sort=desc]::after{content:'▼';color:var(--accent);opacity:1}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
a.wl{border-bottom:1px dashed currentColor}
a.wl:hover{text-decoration:none;border-bottom-style:solid}
a.missing{color:var(--missing)}
.related{margin-top:40px;border-top:1px solid var(--line);padding-top:14px;font-size:13.5px;color:var(--muted)}
.related h4{margin:10px 0 4px;font-size:12.5px;font-weight:600}
.chips a{display:inline-block;margin:4px 6px 0 0;padding:3px 10px;border:1px solid var(--line);border-radius:999px;color:var(--text);background:var(--panel)}
.chips a:hover{border-color:var(--accent);text-decoration:none}
.title-input{width:100%;font-size:28px;font-weight:700;border:none;background:transparent;color:var(--text);outline:none;padding:4px 0;font-family:inherit}
.toolbar{display:flex;gap:4px;flex-wrap:wrap;align-items:center;padding:6px 0 8px;border-bottom:1px solid var(--line);margin-bottom:10px}
.toolbar .btn{padding:4px 9px;min-width:32px}
.toolbar .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.toolbar .hint{margin-left:auto;font-size:12px;color:var(--muted)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px;height:calc(100vh - 190px);min-height:320px}
textarea{width:100%;height:100%;resize:none;border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--panel);color:var(--text);font:14px/1.6 Consolas,"D2Coding","Malgun Gothic",monospace;outline:none;tab-size:2}
textarea:focus{border-color:var(--accent)}
.preview{overflow:auto;border:1px dashed var(--line);border-radius:8px;padding:14px 18px;background:var(--panel)}
.empty{text-align:center;padding:90px 20px;color:var(--muted)}
.empty h2{color:var(--text)}
#status.saving{color:var(--accent)}
#status.err{color:var(--danger)}
.scrim{display:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:center;z-index:50;padding:16px}
.modal[hidden]{display:none}
.modal .card{background:var(--panel);border-radius:12px;padding:22px;width:100%;max-width:360px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal h3{margin:0 0 6px}
.modal p{margin:0 0 14px;color:var(--muted);font-size:13.5px}
.modal input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit;margin-bottom:12px;outline:none}
.modal input:focus{border-color:var(--accent)}
.modal .btn{width:100%;padding:8px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2328;color:#fff;padding:9px 16px;border-radius:8px;font-size:13.5px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px)}
#toast.show{opacity:1}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;inset:0 auto 0 0;width:84%;max-width:300px;z-index:20;transform:translateX(-100%);transition:transform .2s}
  body.nav aside{transform:none}
  body.nav .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:10}
  .menu{display:inline-block}
  .wrap{padding:14px 16px 60px}
  .topbar{flex-wrap:wrap}
  .split{grid-template-columns:1fr;height:auto}
  textarea{height:55vh}
  .preview{display:none}
  .toolbar .hint{display:none}
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><div class="logo">W</div><div>팀 위키<small>설치 없이 함께 쓰는 팀 문서함</small></div></div>
    <div class="search"><input id="q" type="search" placeholder="검색 (Ctrl+K)" autocomplete="off"></div>
    <button class="newbtn" data-act="new">+ 새 페이지</button>
    <div class="sec-title">페이지</div>
    <div id="tree"></div>
    <div class="sec-title">최근 수정</div>
    <div id="recent"></div>
    <div class="foot">
      <div id="team"></div>
      <div class="btns">
        <button class="btn" data-act="export" title="전체 위키를 JSON 파일로 저장">내보내기</button>
        <button class="btn" data-act="import" title="JSON 파일에서 위키 불러오기">가져오기</button>
      </div>
      <div><span id="count"></span> · <span id="status">불러오는 중…</span></div>
    </div>
  </aside>
  <div class="scrim" data-act="menu"></div>
  <main id="main"><div class="empty">불러오는 중…</div></main>
</div>
<div class="modal" id="who" hidden>
  <div class="card">
    <h3>팀 위키에 오신 것을 환영합니다</h3>
    <p>수정 기록과 "편집 중" 표시에 사용할 이름을 입력하세요.</p>
    <input id="whoName" maxlength="20" placeholder="예: 홍길동" autocomplete="off">
    <button class="btn primary" data-act="setname">시작하기</button>
  </div>
</div>
<div id="toast"></div>
<input id="file" type="file" accept=".json,application/json" hidden>
<script src="export.js"></script>
<script>
(function(){
'use strict';
var KEY = 'offline-wiki.v1';     // 개인 모드(브라우저 저장) 데이터
var API = 'api/wiki';
var POLL_MS = 4000, LOCK_BEAT = 15000;
var $ = function(s){ return document.querySelector(s); };

var db = { pages: {} }, cur = null, editing = false, pendingEdit = null, origTitle = '', expanded = {}, saveTimer = null;
// 팀 공유 모드 상태
var mode = 'local', rev = -1, locks = {}, users = [], online = true, lastSig = '';
var dirty = {}, force = {}, flushing = false, pendingUnlock = [], beatTimer = null;
var me = loadMe();

/* ---------- 사용자 ---------- */
function loadMe(){
  var name = '', id = '';
  try { name = localStorage.getItem('wiki.name') || ''; } catch (e) {}
  // 탭마다 다른 ID: 같은 사람이 탭 두 개로 같은 문서를 동시에 편집하는 것도 막는다
  try { id = sessionStorage.getItem('wiki.client') || ''; if (!id) { id = uid(); sessionStorage.setItem('wiki.client', id); } } catch (e) { id = uid(); }
  return { id: id, name: name };
}
function showWho(){ $('#who').hidden = false; var i = $('#whoName'); i.value = me.name; setTimeout(function(){ i.focus(); }, 0); }
function setName(){
  var v = $('#whoName').value.trim(); if (!v) { $('#whoName').focus(); return; }
  me.name = v.slice(0, 20);
  try { localStorage.setItem('wiki.name', me.name); } catch (e) {}
  $('#who').hidden = true; renderTeam(); poll();
}

/* ---------- 저장 ---------- */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function loadLocal(){
  try { var s = localStorage.getItem(KEY); if (s) { var d = JSON.parse(s); if (d && d.pages) return d; } } catch (e) {}
  return seed();
}
function saveLocal(){
  try { localStorage.setItem(KEY, JSON.stringify(db)); setStatus('저장됨 ' + fmt(Date.now()).slice(11), ''); }
  catch (e) { setStatus('저장 실패 — 내보내기로 백업하세요', 'err'); }
}
// 바뀐 페이지를 저장한다. 개인 모드는 브라우저에, 공유 모드는 서버에.
function commit(ids){
  clearTimeout(saveTimer); saveTimer = null;
  if (mode === 'local') { saveLocal(); return; }
  (ids || []).forEach(function(id){ if (id) dirty[id] = 1; });
  flush();
}
function scheduleSave(){
  var p = db.pages[cur]; if (p) p.updated = Date.now();
  setStatus('저장 중…', 'saving');
  clearTimeout(saveTimer); saveTimer = setTimeout(function(){ commit([cur]); }, mode === 'local' ? 400 : 1000);
}
function setStatus(t, cls){ var s = $('#status'); s.textContent = t; s.className = cls || ''; }
function toast(msg, ms){
  var t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.timer); toast.timer = setTimeout(function(){ t.classList.remove('show'); }, ms || 3200);
}

/* ---------- 서버 통신 (팀 공유 모드) ---------- */
function api(method, body){
  var opt = { method: method, headers: { 'X-Wiki-Client': me.id, 'X-Wiki-Name': encodeURIComponent(me.name || '익명') } };
  var url = API;
  if (method === 'GET') url += '?since=' + rev;
  else {
    body.client = me.id; body.name = me.name || '익명';
    opt.headers['Content-Type'] = 'application/json';
    opt.body = JSON.stringify(body);
  }
  return fetch(url, opt).then(function(r){
    return r.json().catch(function(){ return { error: 'HTTP ' + r.status }; }).then(function(j){
      if (!r.ok || j.error) throw new Error(j.error || ('HTTP ' + r.status));
      return j;
    });
  });
}
async function flush(){
  if (flushing || mode !== 'shared') return;
  flushing = true; setStatus('저장 중…', 'saving');
  var id = null;
  try {
    while ((id = Object.keys(dirty)[0])) {
      delete dirty[id];
      var p = db.pages[id]; if (!p) continue;
      var r = await api('POST', { action: 'save', page: p, base: p.version || 0, force: !!force[id] });
      delete force[id];
      if (r.ok) { p.version = r.page.version; p.updated = r.page.updated; p.updatedBy = r.page.updatedBy; }
      else if (r.locked) { toast('🔒 ' + r.by + '님이 편집 중이라 "' + (p.title || '제목 없음') + '"을(를) 저장하지 못했습니다', 5000); rev = -1; }
      else if (r.conflict) {
        if (confirm('"' + (p.title || '제목 없음') + '" 문서를 ' + (r.page.updatedBy || '다른 사람') + '님이 먼저 수정했습니다.\n\n[확인] 내 내용으로 덮어쓰기\n[취소] 상대방 내용 불러오기')) { force[id] = 1; dirty[id] = 1; }
        else { db.pages[id] = r.page; if (id === cur) { if (editing) origTitle = r.page.title; render(); } }
      }
    }
    id = null;
    setStatus('저장됨 ' + fmt(Date.now()).slice(11), '');
    setOnline(true);
  } catch (e) {
    if (id) dirty[id] = 1;
    setStatus('저장 실패 — 연결되면 자동으로 다시 저장합니다', 'err');
    setOnline(false);
  } finally {
    flushing = false;
    if (!Object.keys(dirty).length) pendingUnlock.splice(0).forEach(sendUnlock);
  }
}
async function poll(){
  if (mode !== 'shared' || document.hidden) return;
  if (Object.keys(dirty).length) { flush(); return; }
  if (flushing) return;
  try {
    var r = await api('GET');
    if (flushing || Object.keys(dirty).length) return;   // 저장 중에 받은 응답은 버린다
    setOnline(true);
    applyRemote(r);
  } catch (e) { setOnline(false); }
}
function applyRemote(r){
  locks = r.locks || {}; users = r.users || []; rev = r.rev;
  var changed = !!r.pages;
  if (changed) {
    var keep = editing && db.pages[cur] ? db.pages[cur] : null;   // 내가 편집 중인 페이지는 내 내용 유지
    db.pages = r.pages;
    if (keep) db.pages[cur] = keep;
    if (cur && !db.pages[cur]) { toast('보고 있던 문서가 다른 사람에 의해 삭제되었습니다'); go(firstRoot()); return; }
  }
  var sig = JSON.stringify([rev, locks, users]);
  if (!changed && sig === lastSig) return;
  lastSig = sig;
  renderTeam();
  if (editing) { renderSide(); return; }
  // 표 검색창에 입력 중이면 다시 그린 뒤에도 커서를 그대로 돌려준다
  var f = document.activeElement, qs = [].slice.call(document.querySelectorAll('.tbl-q')), fi = qs.indexOf(f), pos = fi >= 0 ? f.selectionStart : 0;
  var st = $('#main').scrollTop; render(); $('#main').scrollTop = st;
  if (fi >= 0) { var nf = document.querySelectorAll('.tbl-q')[fi]; if (nf) { nf.focus(); nf.setSelectionRange(pos, pos); } }
}
function setOnline(v){ if (online !== v) { online = v; renderTeam(); } }
function lockOf(id){ var l = locks[id]; return l && !l.mine ? l : null; }
function beat(){
  clearInterval(beatTimer);
  beatTimer = setInterval(function(){
    if (!editing || mode !== 'shared') return;
    api('POST', { action: 'lock', id: cur }).then(function(r){
      if (!r.ok) toast('⚠️ 편집 잠금이 풀려 ' + r.by + '님이 편집을 시작했습니다. 저장이 거부될 수 있습니다', 6000);
    }).catch(function(){});
  }, LOCK_BEAT);
}
function releaseLock(id){
  clearInterval(beatTimer);
  if (mode !== 'shared' || !id) return;
  delete locks[id];
  // 마지막 저장이 끝난 뒤에 잠금을 푼다 (그 사이 다른 사람이 잡으면 내 저장이 거부되므로)

/* ---------- 데이터 헬퍼 ---------- */
function pagesArr(){ return Object.keys(db.pages).map(function(k){ return db.pages[k]; }); }

function findByTitle(t){

function ancestors(id){

}
function descendants(id){

function linksOf(body){

}

/* ---------- 유틸 ---------- */
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function escRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function pad(n){ return (n < 10 ? '0' : '') + n; }
function fmt(t){ var d = new Date(t); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function ago(t){
  var s = (Date.now() - t) / 1000;
  if (s < 60) return '방금'; if (s < 3600) return Math.floor(s / 60) + '분 전';
  if (s < 86400) return Math.floor(s / 3600) + '시간 전'; if (s < 86400 * 30) return Math.floor(s / 86400) + '일 전';

}
function hl(t, q){
  var i = t.toLowerCase().indexOf(q);

  return esc(t.slice(0, i)) + '<mark>' + esc(t.slice(i, i + q.length)) + '</mark>' + esc(t.slice(i + q.length));
}
function download(name, text, type){
  var a = document.createElement('a');

  a.download = name.replace(/[\\/:*?"<>|]/g, '_');

/* ---------- 마크다운 렌더러 (외부 라이브러리 없음) ---------- */
function inline(s){
  var keep = [];
  function ph(html){ keep.push(html); return '\u0000' + (keep.length - 1) + '\u0000'; }
  s = s.replace(/`([^`]+)`/g, function(m, c){ return ph('<code>' + esc(c) + '</code>'); });
  s = s.replace(/\[\[([^\]]+?)\]\]/g, function(m, t){
    t = t.trim(); var p = findByTitle(t);
    return ph(p ? '<a href="#/p/' + p.id + '" class="wl">' + esc(t) + '</a>'
               : '<a href="#" class="wl missing" data-new="' + esc(t) + '" title="클릭하면 이 제목으로 새 페이지를 만듭니다">' + esc(t) + '</a>');
  });
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function(m, t, u){
    if (/^\s*(javascript|data|vbscript):/i.test(u)) return m;
    return ph('<a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(t) + '</a>');
  });
  s = esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\s][^*]*?)\*/g, '$1<em>$2</em>')
    .replace(/~~(.+?)~~/g, '<del>$1</del>');
  return s.replace(/\u0000(\d+)\u0000/g, function(m, n){ return keep[n]; });
}
function md(src, base){
  if (base === undefined) base = 0;
  var L = String(src).replace(/\r/g, '').split('\n'), out = '', i = 0, m;
  var LIST = /^(\s*)([-*+]|\d+\.)\s+(.*)$/;
  var SEP = /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/;
  function blockStart(l){ return /^(#{1,6}\s|```|>)/.test(l) || LIST.test(l) || /^\s*(---|\*\*\*|___)\s*$/.test(l); }
  function cells(r){ return r.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(function(c){ return c.trim(); }); }
  while (i < L.length) {
    var l = L[i];
    if (!l.trim()) { i++; continue; }
    if (/^```/.test(l)) {
      var buf = []; i++;
      while (i < L.length && !/^```/.test(L[i])) buf.push(L[i++]);
      i++; out += '<pre><code>' + esc(buf.join('\n')) + '</code></pre>'; continue;
    }
    if ((m = l.match(/^(#{1,6})\s+(.*)$/))) { var n = m[1].length; out += '<h' + n + '>' + inline(m[2]) + '</h' + n + '>'; i++; continue; }
    if (/^\s*(---|\*\*\*|___)\s*$/.test(l)) { out += '<hr>'; i++; continue; }
    if (/^>/.test(l)) {
      var q = [];
      while (i < L.length && /^>/.test(L[i])) q.push(L[i++].replace(/^>\s?/, ''));
      out += '<blockquote>' + md(q.join('\n'), -1) + '</blockquote>'; continue;
    }
    if (l.indexOf('|') >= 0 && i + 1 < L.length && SEP.test(L[i + 1])) {
      var head = cells(l), rows = []; i += 2;
      while (i < L.length && L[i].indexOf('|') >= 0 && L[i].trim()) rows.push(cells(L[i++]));
      out += '<div class="tbl"><table><thead><tr>' + head.map(function(c){ return '<th>' + inline(c) + '</th>'; }).join('') +
        '</tr></thead><tbody>' + rows.map(function(r){
          return '<tr>' + head.map(function(_, k){ return '<td>' + inline(r[k] || '') + '</td>'; }).join('') + '</tr>';
        }).join('') + '</tbody></table></div>';
      continue;
    }
    if (LIST.test(l)) {
      var html = '', stack = [];
      while (i < L.length && LIST.test(L[i])) {
        var mm = L[i].match(LIST), ind = mm[1].replace(/\t/g, '  ').length, type = /\d/.test(mm[2]) ? 'ol' : 'ul';
        while (stack.length && ind < stack[stack.length - 1].ind) html += '</li></' + stack.pop().type + '>';
        if (!stack.length || ind > stack[stack.length - 1].ind) { stack.push({ ind: ind, type: type }); html += '<' + type + '>'; }
        else html += '</li>';
        var cb = mm[3].match(/^\[([ xX])\]\s+(.*)$/);
        if (cb) {
          var on = cb[1] !== ' ';
          html += '<li class="task' + (on ? ' done' : '') + '"><input type="checkbox"' + (on ? ' checked' : '') +
            (base >= 0 ? ' data-line="' + (i + base) + '"' : ' disabled') + '><span>' + inline(cb[2]) + '</span>';
        } else html += '<li>' + inline(mm[3]);
        i++;
      }
      while (stack.length) html += '</li></' + stack.pop().type + '>';
      out += html; continue;
    }
    var p = [];
    while (i < L.length && L[i].trim() && !blockStart(L[i]) && !(L[i].indexOf('|') >= 0 && i + 1 < L.length && SEP.test(L[i + 1]))) p.push(L[i++]);
    if (!p.length) p.push(L[i++]);
    out += '<p>' + p.map(inline).join('<br>') + '</p>';
  }
  return out;
}

/* ---------- 표 검색 / 정렬 (보기 화면 전용, 문서 내용은 바꾸지 않음) ---------- */
var tableState = {};   // 페이지·표별 상태: 화면을 다시 그려도 검색어와 정렬을 유지
function sortNum(s){ var t = s.replace(/,/g, '').trim(); return /^-?\d+(\.\d+)?%?$/.test(t) ? parseFloat(t) : null; }
function sortCmp(a, b){
  var na = sortNum(a), nb = sortNum(b);
  if (na !== null && nb !== null) return na - nb;
  return a.localeCompare(b, 'ko', { numeric: true, sensitivity: 'base' });
}
function enhanceTables(root){
  if (!root) return;
  root.querySelectorAll('.tbl').forEach(function(box, ti){
    var table = box.querySelector('table'), body = table.tBodies[0];
    if (!body || !table.tHead || body.rows.length < 2) return;
    var rows = [].slice.call(body.rows), ths = [].slice.call(table.tHead.rows[0].cells);
    var st = tableState[cur + ':' + ti] || (tableState[cur + ':' + ti] = { q: '', col: -1, dir: 0 });
    rows.forEach(function(r, i){ r.dataset.i = i; });
    var bar = document.createElement('div');
    bar.className = 'tbl-bar';
    bar.innerHTML = '<input type="search" class="tbl-q" placeholder="표에서 찾기" autocomplete="off"><span class="tbl-count"></span><button class="tbl-reset" hidden>초기화</button>';
    box.parentNode.insertBefore(bar, box);
    var q = bar.querySelector('.tbl-q'), count = bar.querySelector('.tbl-count'), reset = bar.querySelector('.tbl-reset');
    q.value = st.q;
    function text(r, c){ return r.cells[c] ? r.cells[c].textContent.trim() : ''; }
    function apply(){
      var needle = st.q.trim().toLowerCase(), shown = 0, order = rows.slice();
      if (st.dir) order.sort(function(a, b){
        var x = text(a, st.col), y = text(b, st.col);
        if (!x !== !y) return x ? -1 : 1;   // 빈 칸은 항상 맨 아래
        return sortCmp(x, y) * st.dir || a.dataset.i - b.dataset.i;
      });
      order.forEach(function(r){
        body.appendChild(r);
        var hit = !needle || r.textContent.toLowerCase().indexOf(needle) >= 0;
        r.hidden = !hit; if (hit) shown++;
      });
      ths.forEach(function(th, c){ th.dataset.sort = c === st.col ? (st.dir > 0 ? 'asc' : 'desc') : ''; });
      count.textContent = needle ? shown + ' / ' + rows.length + '행' : rows.length + '행';
      reset.hidden = !needle && !st.dir;
    }
    ths.forEach(function(th, c){
      th.classList.add('sortable');
      th.title = '클릭하면 정렬 (오름차순 → 내림차순 → 원래 순서)';
      th.addEventListener('click', function(){
        if (st.col !== c) { st.col = c; st.dir = 1; }
        else if (st.dir === 1) st.dir = -1;
        else { st.col = -1; st.dir = 0; }
        apply();
      });
    });
    q.addEventListener('input', function(){ st.q = q.value; apply(); });
    q.addEventListener('keydown', function(e){ if (e.key === 'Escape') { e.stopPropagation(); st.q = q.value = ''; apply(); } });
    reset.addEventListener('click', function(){ st.q = q.value = ''; st.col = -1; st.dir = 0; apply(); });
    apply();
  });
}

  if (p) {
    var nt = (p.title || '').trim(), ot = (origTitle || '').trim();
    // 제목이 바뀌면 다른 문서의 [[옛 제목]] 링크도 함께 바꿔준다 (다른 사람이 편집 중인 문서는 건너뜀)
    if (ot && nt && ot !== nt) {
      var find = new RegExp('\\[\\[\\s*' + escRe(ot) + '\\s*\\]\\]', 'i'), all = new RegExp(find.source, 'gi');
      pagesArr().forEach(function(o){
        if (o.id === p.id || !find.test(o.body) || lockOf(o.id)) return;
        o.body = o.body.replace(all, '[[' + nt + ']]'); ids.push(o.id);
      });
    }
    p.title = nt; ids.unshift(p.id);
  }
  editing = false;
  commit(ids);
  if (p) releaseLock(p.id);
}
function finishEdit(){ commitEdit(); render(); }
function newPage(parent, title){ pendingEdit = createPage(parent, title); go(pendingEdit); }
async function delPage(){
  var p = db.pages[cur], ids = descendants(cur);
  var msg = '"' + (p.title || '제목 없음') + '"' + (ids.length > 1 ? ' 및 하위 페이지 ' + (ids.length - 1) + '개를' : '을(를)') + ' 삭제할까요?\n되돌릴 수 없습니다. 필요하면 먼저 내보내기로 백업하세요.';
  if (!confirm(msg)) return;
  if (mode === 'shared') {
    try {
      var r = await api('POST', { action: 'delete', ids: ids });
      if (!r.ok) { toast('🔒 ' + r.by + '님이 편집 중인 문서가 있어 삭제할 수 없습니다'); return; }
    } catch (e) { toast('삭제하지 못했습니다: ' + e.message); return; }
  }
  ids.forEach(function(id){ delete db.pages[id]; delete dirty[id]; });
  if (mode === 'local') saveLocal();
  go(p.parent && db.pages[p.parent] ? p.parent : firstRoot());
}
function toggleTask(input){
  var p = db.pages[cur], lk = lockOf(cur);
  if (lk) { toast('🔒 ' + lk.name + '님이 편집 중이라 체크할 수 없습니다'); render(); return; }
  var lines = p.body.split('\n'), n = +input.getAttribute('data-line');
  lines[n] = lines[n].replace(/\[([ xX])\]/, function(m, c){ return c === ' ' ? '[x]' : '[ ]'; });
  p.body = lines.join('\n'); p.updated = Date.now(); p.updatedBy = me.name;
  commit([cur]); render();
}
function insert(kind){
  var ta = $('#ta'), s = ta.selectionStart, e = ta.selectionEnd, sel = ta.value.slice(s, e);
  var T = {
    b: ['**', '**', '굵게'], i: ['*', '*', '기울임'], code: ['`', '`', 'code'],
    h2: ['\n## ', '', '제목'], ul: ['\n- ', '', '항목'], task: ['\n- [ ] ', '', '할 일'],
    link: ['[[', ']]', '페이지 제목'], pre: ['\n```\n', '\n```\n', '코드'],
    table: ['\n| 항목 | 내용 |\n|---|---|\n| ', ' |  |\n', '값']
  }[kind];
  var before = T[0], after = T[1], text = sel || T[2];
  if (before.charAt(0) === '\n' && (s === 0 || ta.value.charAt(s - 1) === '\n')) before = before.slice(1);
  ta.setRangeText(before + text + after, s, e, 'end');
  ta.selectionStart = s + before.length; ta.selectionEnd = s + before.length + text.length;
  ta.focus(); ta.dispatchEvent(new Event('input'));
}
// 페이지를 Office 파일로 저장. 라이브러리는 처음 쓸 때만 vendor/ 에서 불러온다.
var LIBS = {
  docx: { src: 'vendor/docx-9.12.0.iife.js', global: 'docx', mime: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' },
  xlsx: { src: 'vendor/xlsx-0.20.3.full.min.js', global: 'XLSX', mime: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' },
  pptx: { src: 'vendor/pptxgenjs-4.0.1.bundle.js', global: 'PptxGenJS', mime: 'application/vnd.openxmlformats-officedocument.presentationml.presentation' }
};
var loaded = {};
function loadScript(src){
  if (!loaded[src]) loaded[src] = new Promise(function(ok, fail){
    var s = document.createElement('script'); s.src = src;
    s.onload = ok; s.onerror = function(){ delete loaded[src]; fail(new Error(src + ' 파일을 불러오지 못했습니다')); };
    document.head.appendChild(s);
  });
  return loaded[src];
}
async function exportPage(kind){
  var p = db.pages[cur]; if (!p) return;
  var name = (p.title || '제목 없음') + '.' + kind;
  if (kind === 'md') { download(name, '# ' + p.title + '\n\n' + p.body, 'text/markdown;charset=utf-8'); return; }
  var lib = LIBS[kind];
  toast(name + ' 만드는 중…', 10000);
  try {
    if (!window.WikiExport) throw new Error('export.js 파일을 불러오지 못했습니다');
    await loadScript(lib.src);
    var ctx = { path: ancestors(p.id).map(function(a){ return a.title || '제목 없음'; }).concat(p.title || '제목 없음').join(' / '), updated: fmt(p.updated), by: p.updatedBy || '' };
    var bytes = await WikiExport.build(kind, p, ctx, window[lib.global]);
    download(name, bytes, lib.mime);
    toast(name + ' 저장 완료');
  } catch (e) { toast('파일을 만들지 못했습니다: ' + e.message, 6000); }
}
async function importData(d){
  var n = Object.keys(d.pages).length;
  if (mode === 'shared') {
    if (!confirm('⚠️ 팀 전체 위키(' + pagesArr().length + '개 페이지)를 불러온 파일(' + n + '개 페이지)로 바꿉니다.\n모든 팀원에게 적용됩니다. 계속할까요?')) return;
    try { await api('POST', { action: 'import', pages: d.pages }); } catch (e) { toast('가져오기 실패: ' + e.message); return; }
    db = { pages: d.pages }; rev = -1;
  } else {
    if (!confirm('현재 위키(' + pagesArr().length + '개 페이지)를 불러온 파일(' + n + '개 페이지)로 바꿉니다. 계속할까요?')) return;
    db = d; saveLocal();
  }
  go(firstRoot()); toast('가져오기 완료');
}

/* ---------- 이벤트 ---------- */
document.addEventListener('click', function(e){
  var t = e.target, el;
  // 열린 드롭다운 메뉴는 메뉴 밖을 누르면 닫는다
  document.querySelectorAll('.dd-menu:not([hidden])').forEach(function(m){ if (!m.parentNode.contains(t)) m.hidden = true; });
  if ((el = t.closest('[data-fmt]'))) { el.parentNode.hidden = true; exportPage(el.getAttribute('data-fmt')); return; }
  if ((el = t.closest('[data-tw]'))) { var k = el.getAttribute('data-tw'); expanded[k] = !expanded[k]; renderSide(); return; }
  if ((el = t.closest('[data-add]'))) { newPage(el.getAttribute('data-add')); return; }
  if ((el = t.closest('a.missing'))) { e.preventDefault(); newPage(cur, el.getAttribute('data-new')); return; }
  if ((el = t.closest('[data-ins]'))) { insert(el.getAttribute('data-ins')); return; }
  if ((el = t.closest('.row[data-id]'))) { go(el.getAttribute('data-id')); return; }
  if ((el = t.closest('[data-act]'))) {
    e.preventDefault();
    if (el.disabled) return;
    var a = el.getAttribute('data-act');
    if (a === 'new') newPage(null);
    else if (a === 'child') newPage(cur);
    else if (a === 'edit') startEdit();
    else if (a === 'done') finishEdit();
    else if (a === 'del') delPage();
    else if (a === 'menu') document.body.classList.toggle('nav');
    else if (a === 'setname') setName();
    else if (a === 'rename') showWho();
    else if (a === 'dl') { var dm = el.parentNode.querySelector('.dd-menu'); dm.hidden = !dm.hidden; }
    else if (a === 'export') { download('team-wiki-' + fmt(Date.now()).slice(0, 10) + '.json', JSON.stringify(db, null, 2), 'application/json'); setStatus('내보내기 완료', ''); }
    else if (a === 'import') $('#file').click();
  }
});
document.addEventListener('change', function(e){
  if (e.target.matches && e.target.matches('input[data-line]')) toggleTask(e.target);
});
document.addEventListener('input', function(e){
  var p = db.pages[cur];
  if (e.target.id === 'q') { renderSide(); return; }
  if (!p) return;
  if (e.target.id === 'ta') { p.body = e.target.value; $('#pv').innerHTML = md(p.body, -1); scheduleSave(); }
  else if (e.target.id === 'ti') { p.title = e.target.value; scheduleSave(); renderSide(); }
});
document.addEventListener('keydown', function(e){
  var mod = e.ctrlKey || e.metaKey, k = (e.key || '').toLowerCase();
  if (e.target.id === 'whoName') { if (e.key === 'Enter') setName(); return; }
  if (mod && k === 's') { e.preventDefault(); commit(editing ? [cur] : []); }
  else if (mod && k === 'e') { e.preventDefault(); if (editing) finishEdit(); else startEdit(); }
  else if (mod && k === 'k') { e.preventDefault(); document.body.classList.add('nav'); $('#q').focus(); $('#q').select(); }
  else if (e.key === 'Escape') { if (editing) finishEdit(); else if (document.activeElement === $('#q')) { $('#q').value = ''; renderSide(); $('#q').blur(); } }
  else if (e.key === 'Tab' && e.target.id === 'ta') { e.preventDefault(); e.target.setRangeText('  ', e.target.selectionStart, e.target.selectionEnd, 'end'); e.target.dispatchEvent(new Event('input')); }
  else if (e.key === 'Enter' && e.target.id === 'ti') { e.preventDefault(); $('#ta').focus(); }
});
$('#file').addEventListener('change', function(){
  var f = this.files[0]; if (!f) return;
  var r = new FileReader();
  r.onload = function(){
    var d;
    try { d = JSON.parse(r.result); if (!d || typeof d.pages !== 'object') throw new Error('형식 오류'); }
    catch (err) { alert('위키 JSON 파일이 아닙니다: ' + err.message); return; }
    importData(d);
  };
  r.readAsText(f, 'utf-8');
  this.value = '';
});
window.addEventListener('hashchange', route);
// 창을 닫을 때: 남은 내용을 저장하고 잠금을 푼다 (sendBeacon 은 창이 닫혀도 전송된다)
window.addEventListener('pagehide', function(){
  if (mode === 'local') { if (saveTimer) saveLocal(); return; }
  function beacon(b){ b.client = me.id; b.name = me.name || '익명'; navigator.sendBeacon(API, new Blob([JSON.stringify(b)], { type: 'application/json' })); }
  if (saveTimer && db.pages[cur]) beacon({ action: 'save', page: db.pages[cur], base: db.pages[cur].version || 0 });
  if (editing && cur) beacon({ action: 'unlock', id: cur });
});
document.addEventListener('visibilitychange', function(){ if (!document.hidden) poll(); });

/* ---------- 시작 ---------- */
function init(){
  expanded = {};
  children(null).forEach(function(p){ expanded[p.id] = true; });
  renderTeam();
  route();
}
function startLocal(msg){
  mode = 'local'; db = loadLocal(); init();
  setStatus('브라우저에 자동 저장', '');
  if (msg) toast(msg, 6000);
}
async function boot(){
  if (location.protocol === 'file:') { startLocal(''); return; }
  try {
    var r = await api('GET');
    if (!r.seeded) { await api('POST', { action: 'seed', pages: seed().pages }); rev = -1; r = await api('GET'); }
    mode = 'shared';
    db = { pages: r.pages || {} }; rev = r.rev; locks = r.locks || {}; users = r.users || [];
    lastSig = JSON.stringify([rev, locks, users]);
    init();
    setStatus('서버에 자동 저장', '');
    if (!me.name) showWho();
    setInterval(poll, POLL_MS);
  } catch (e) {
    startLocal('공유 서버에 연결하지 못해 개인 모드로 실행합니다 (' + e.message + ')');
  }
}
boot();
})();
